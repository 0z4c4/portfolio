<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ozaca · Diseño y desarrollo para marcas que quieren crecer: webs, identidad, contenido audiovisual e infraestructura. Hablemos por WhatsApp."
    />
    <title>Ozaca · Diseño y desarrollo para marcas que crecen</title>
    <script>
      // Tema persistido sin flash: se aplica antes de que pinte React.
      (function () {
        try {
          var saved = localStorage.getItem("portfolio-theme");
          document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      // Fallback de SPA para GitHub Pages (404.html → /?/ruta → URL real).
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
